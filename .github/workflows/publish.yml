name: Build release and publish product page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: metadata-eraser-pro-publish
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lossless cleaner tests
        run: npm test
      - name: Build portable Windows edition
        run: npx --yes electron-builder@26.15.3 --win portable --x64
      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Publish v1.1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Metadata Eraser Pro v1.1.0
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Ready-to-run Windows x64 portable edition.

            No installation is required. The executable is not Authenticode-signed, so Windows may report an unknown publisher. Verify it against SHA256SUMS.txt before running.

            Images are processed locally and are never uploaded by the app.
          files: |
            dist/*.exe
            SHA256SUMS.txt

  product-page:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages when needed
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow'
              });
            } catch (error) {
              if (error.status !== 409) throw error;
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy product page
        id: deployment
        uses: actions/deploy-pages@v4

